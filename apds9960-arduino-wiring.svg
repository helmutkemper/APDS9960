<circle cx="108" cy="150" r="2.5" fill="#ffaa00" opacity="0.6"/>
<text x="95" y="148" font-size="5.5" fill="rgba(255,255,255,0.4)">TX</text>
<circle cx="108" cy="162" r="2.5" fill="#ffaa00" opacity="0.6"/>
<text x="95" y="160" font-size="5.5" fill="rgba(255,255,255,0.4)">RX</text>

<!-- Arduino logo -->
<text x="220" y="170" text-anchor="middle" font-size="20" fill="rgba(255,255,255,0.25)" font-weight="bold">Arduino UNO</text>

<!-- Mounting holes -->
<circle cx="52" cy="90" r="5" fill="#006688"/>
<circle cx="52" cy="90" r="3" fill="#e8e0d8"/>
<circle cx="408" cy="90" r="5" fill="#006688"/>
