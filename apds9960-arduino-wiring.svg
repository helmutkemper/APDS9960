<text x="170" y="103" text-anchor="middle" font-size="5.5" fill="rgba(255,255,255,0.4)" transform="rotate(-90,170,103)">SDA</text>
<text x="185" y="103" text-anchor="middle" font-size="5.5" fill="rgba(255,255,255,0.4)" transform="rotate(-90,185,103)">AREF</text>
<text x="200" y="103" text-anchor="middle" font-size="5.5" fill="rgba(255,255,255,0.4)" transform="rotate(-90,200,103)">GND</text>
