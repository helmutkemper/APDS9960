<!-- ============================================================ -->
<!--                        WIRES                                 -->
<!-- ============================================================ -->

<!-- 3V3 → VCC (red) -->
<path class="wire wire-red"
      d="M 130 344 L 130 400 L 475 400 L 475 345 L 572 345 L 572 317"/>

<!-- GND → GND (black) -->
<path class="wire wire-black"
      d="M 160 344 L 160 410 L 470 410 L 470 355 L 548 355 L 548 317"/>

<!-- A4 SDA → SDA (green) -->
<path class="wire wire-green"
      d="M 302 344 L 302 393 L 480 393 L 480 338 L 596 338 L 596 317"/>

<!-- A5 SCL → SCL (blue) -->
<path class="wire wire-blue"
      d="M 317 344 L 317 386 L 485 386 L 485 332 L 620 332 L 620 317"/>

<!-- Pin 3 → INT (yellow) -->
<path class="wire wire-yellow"
      d="M 345 84 L 345 40 L 690 40 L 690 310 L 651 310"/>

</svg>
