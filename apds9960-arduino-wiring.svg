<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg">
<defs><style>
  text { font-family: monospace; }
  .wire { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .wire-red    { stroke: #dc2626; }
  .wire-black  { stroke: #1a1a1a; }
  .wire-green  { stroke: #16a34a; }
  .wire-blue   { stroke: #2563eb; }
  .wire-yellow { stroke: #eab308; }
</style></defs>

<!-- ============================================================ -->
<!--                      ARDUINO UNO                             -->
<!-- ============================================================ -->

<rect x="30" y="70" width="400" height="280" rx="6" fill="#0088aa" stroke="#006688" stroke-width="2"/>

<!-- USB-B connector -->
<rect x="15" y="115" width="38" height="48" rx="3" fill="#aaa" stroke="#777" stroke-width="1.5"/>
<rect x="20" y="122" width="28" height="34" rx="2" fill="#888" stroke="#666" stroke-width="0.8"/>

<!-- DC barrel jack -->
<rect x="15" y="185" width="36" height="26" rx="3" fill="#222" stroke="#444" stroke-width="1"/>
<circle cx="33" cy="198" r="5" fill="#111" stroke="#333" stroke-width="0.5"/>

<!-- Reset button -->
<circle cx="75" cy="108" r="7" fill="#cc2222" stroke="#991111" stroke-width="1"/>
<circle cx="75" cy="108" r="4.5" fill="#dd4444"/>
<text x="75" y="125" text-anchor="middle" font-size="5.5" fill="rgba(255,255,255,0.4)">RESET</text>

<!-- Crystal -->
<rect x="200" y="195" width="26" height="9" rx="2" fill="#c0c0c0" stroke="#999" stroke-width="0.5"/>

<!-- ATmega328P -->
