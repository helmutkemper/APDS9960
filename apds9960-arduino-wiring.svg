<text x="242" y="322" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.4)" transform="rotate(90,242,322)">A0</text>
<text x="257" y="322" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.4)" transform="rotate(90,257,322)">A1</text>
<text x="272" y="322" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.4)" transform="rotate(90,272,322)">A2</text>
<text x="287" y="322" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.4)" transform="rotate(90,287,322)">A3</text>
<text x="302" y="322" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="bold" transform="rotate(90,302,322)">A4</text>
<text x="317" y="322" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="bold" transform="rotate(90,317,322)">A5</text>
<text x="280" y="376" text-anchor="middle" font-size="5.5" fill="rgba(255,255,255,0.3)">ANALOG IN</text>

