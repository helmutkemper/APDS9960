<text x="280" y="56" text-anchor="middle" font-size="5.5" fill="rgba(255,255,255,0.3)">DIGITAL (PWM~)</text>

<!-- ===== POWER PINS (bottom-left) ===== -->
<rect x="90" y="330" width="115" height="20" rx="2" fill="#222" stroke="#444" stroke-width="0.8"/>

<circle cx="100" cy="340" r="3.2" fill="#111" stroke="#555" stroke-width="0.4"/>
