<text x="130" y="322" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="bold" transform="rotate(90,130,322)">3V3</text>
<text x="145" y="322" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.4)" transform="rotate(90,145,322)">5V</text>
<text x="160" y="322" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" transform="rotate(90,160,322)">GND</text>
<text x="175" y="322" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.4)" transform="rotate(90,175,322)">GND</text>
<text x="190" y="322" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.4)" transform="rotate(90,190,322)">VIN</text>
<text x="140" y="376" text-anchor="middle" font-size="5.5" fill="rgba(255,255,255,0.3)">POWER</text>

<!-- ===== ANALOG PINS (bottom-right) ===== -->
<rect x="230" y="330" width="100" height="20" rx="2" fill="#222" stroke="#444" stroke-width="0.8"/>

<circle cx="242" cy="340" r="3.2" fill="#111" stroke="#555" stroke-width="0.4"/>
